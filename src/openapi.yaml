openapi: 3.0.3
info:
  title: KYC Client Onboarding API
  description: Relay API for managing KYC clients, onboarding cases, and submitted documents.
  version: "1.0"
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Clients
  - name: Onboarding Cases
  - name: Officers
  - name: Document Types
  - name: System

paths:
  /health:
    get:
      tags: [System]
      summary: Readiness check
      description: Reports whether the service can accept traffic (checks database connectivity).
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
                  database: { type: string, example: UP }
        "503":
          description: Service is down (database unreachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: DOWN }
                  database: { type: string, example: DOWN }
                  error: { type: string }

  /openapi.yaml:
    get:
      tags: [System]
      summary: This OpenAPI specification
      responses:
        "200":
          description: OpenAPI spec in YAML format

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in as a client, compliance officer, or admin compliance officer
      description: >
        Checks the username/password against the client, compliance_officer and
        admin_officer tables in that order and returns the matched role and entity id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string, enum: [CLIENT, COMPLIANCE_OFFICER, ADMIN_COMPLIANCE_OFFICER] }
                  entity_id: { type: integer, description: client_id, officer_id or admin_id depending on role }
                  full_name: { type: string }
                  username: { type: string }
        "400":
          description: Missing username or password
        "401":
          description: Invalid username or password

  /api/clients:
    get:
      tags: [Clients]
      summary: List a summary of all clients
      responses:
        "200":
          description: Array of client summaries
    post:
      tags: [Clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, client_type, nationality, country_of_birth, date_of_birth, tax_residency, status, is_active]
              properties:
                full_name: { type: string }
                client_type: { type: string, enum: [INDIVIDUAL, CORPORATE, TRUST, POLITICAL] }
                nationality: { type: string, minLength: 2, maxLength: 2 }
                country_of_birth: { type: string, minLength: 2, maxLength: 2 }
                date_of_birth: { type: string, format: date }
                tax_residency: { type: string, minLength: 2, maxLength: 2 }
                status: { type: string }
                is_active: { type: boolean }
      responses:
        "201": { description: Client created }
        "400": { description: Missing required fields }

  /api/clients/{id}:
    get:
      tags: [Clients]
      summary: Get the full record for a client by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Client record }
        "404": { description: Client not found }

  /api/clients/expiring-documents:
    get:
      tags: [Clients]
      summary: List documents expiring within a lookahead window
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 30 }
      responses:
        "200": { description: Array of expiring documents }

  /api/onboarding/cases:
    get:
      tags: [Onboarding Cases]
      summary: List onboarding cases, optionally filtered by status
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200": { description: Array of case summaries }
    post:
      tags: [Onboarding Cases]
      summary: Open a new onboarding case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, product_type, case_status]
              properties:
                client_id: { type: integer }
                product_type: { type: string }
                case_status: { type: string }
      responses:
        "201": { description: Case created }
        "400": { description: Missing required fields }

  /api/onboarding/cases/open:
    post:
      tags: [Onboarding Cases]
      summary: Open a new onboarding case together with a new client, address, initial documents, and optional officer assignment
      description: >
        Also automatically provisions the client's login: a username derived from
        full_name (lowercased, spaces replaced with dots) and a randomly generated
        temporary password. Only the password's hash is stored; delivery of the
        credentials to the client is currently a logging stub (see NotificationService).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client, address, product_type]
              properties:
                client:
                  type: object
                  required: [full_name, client_type, nationality, date_of_birth, country_of_birth, tax_residency]
                  properties:
                    full_name: { type: string }
                    client_type: { type: string, enum: [INDIVIDUAL, CORPORATE, TRUST, POLITICAL] }
                    nationality: { type: string }
                    date_of_birth: { type: string, format: date }
                    country_of_birth: { type: string }
                    tax_residency: { type: string }
                    occupation: { type: string }
                    employer: { type: string }
                    main_source_of_funds: { type: string }
                    annual_income_band: { type: string }
                address:
                  type: object
                  required: [line1, city, country]
                  properties:
                    address_type: { type: string, enum: [REGISTERED, MAILING] }
                    line1: { type: string }
                    line2: { type: string }
                    city: { type: string }
                    state: { type: string }
                    postcode: { type: string }
                    country: { type: string }
                product_type: { type: string }
                due_date: { type: string, format: date }
                officer_id: { type: integer, nullable: true }
                document_type_ids:
                  type: array
                  items: { type: integer }
      responses:
        "201": { description: Case, client, and address created; case_id and client_id returned }
        "400": { description: Missing required fields }

  /api/onboarding/cases/{id}:
    get:
      tags: [Onboarding Cases]
      summary: Get case details, including client info and submitted documents
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Case details }
        "404": { description: Case not found }

  /api/onboarding/cases/{id}/status:
    patch:
      tags: [Onboarding Cases]
      summary: Update the status of a case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_status]
              properties:
                case_status: { type: string, enum: [OPEN, AWAITING_DOCUMENTS, IN_REVIEW, APPROVED, REJECTED] }
      responses:
        "200": { description: Case status updated }
        "404": { description: Case not found }
        "409": { description: Requested transition is not allowed }

  /api/onboarding/cases/{id}/documents:
    post:
      tags: [Onboarding Cases]
      summary: Submit a new document for a case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_type_id]
              properties:
                doc_type_id: { type: integer }
      responses:
        "201": { description: Document submitted }
        "400": { description: Missing required field }

  /api/onboarding/cases/{id}/documents/{docId}/verify:
    patch:
      tags: [Onboarding Cases]
      summary: Mark a case document as verified
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: docId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Document verified }
        "404": { description: Document not found or does not match the case }

  /api/onboarding/cases/{id}/officer:
    patch:
      tags: [Onboarding Cases]
      summary: Assign or unassign the compliance officer handling a case
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [officer_id]
              properties:
                officer_id: { type: integer, nullable: true, description: Officer to assign, or null to unassign }
      responses:
        "200":
          description: Officer assigned/unassigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  case_id: { type: integer }
                  assigned_officer_id: { type: integer, nullable: true }
                  officer_name: { type: string, nullable: true }
        "404": { description: Case not found }

  /api/onboarding/cases/{id}/risk-classification:
    patch:
      tags: [Onboarding Cases]
      summary: Record a new risk classification for a case
      description: >
        Derives the next review date from the risk level (90/180/365 days out).
        A risk classification must exist before a case can be moved to
        APPROVED or REJECTED.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [risk_level, rationale]
              properties:
                risk_level: { type: string, enum: [LOW, MEDIUM, HIGH] }
                rationale: { type: string }
                officer_id: { type: integer, nullable: true }
      responses:
        "200":
          description: Risk classification recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  case_id: { type: integer }
        "400": { description: Missing required fields or invalid risk_level }

  /api/officers:
    get:
      tags: [Officers]
      summary: List all compliance officers
      responses:
        "200":
          description: Array of officers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    officer_id: { type: integer }
                    full_name: { type: string }

  /api/document-types:
    get:
      tags: [Document Types]
      summary: List all known document types
      responses:
        "200":
          description: Array of document types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    doc_type_id: { type: integer }
                    doc_type_name: { type: string }
